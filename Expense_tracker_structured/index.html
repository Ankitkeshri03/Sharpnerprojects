<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="card tracker-card mx-auto">
        <div class="tracker-header">
          <h2 class="mb-1">💰 Expense Tracker</h2>
          <p class="mb-0 opacity-75">Keep an eye on where your money goes</p>
        </div>

        <div class="card-body p-4">
          <form id="expenseForm" class="row g-3">
            <div class="col-md-3">
              <label class="form-label" for="amount">Amount (₹)</label>
              <input
                type="number"
                id="amount"
                class="form-control"
                min="0.01"
                step="0.01"
                placeholder="0.00"
                required
              />
            </div>

            <div class="col-md-4">
              <label class="form-label" for="description">Description</label>
              <input
                type="text"
                id="description"
                class="form-control"
                placeholder="Enter description"
                required
              />
            </div>

            <div class="col-md-3">
              <label class="form-label" for="category">Category</label>
              <select id="category" class="form-select">
                <option>Movie</option>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Other</option>
              </select>
            </div>

            <div class="col-md-2 d-flex align-items-end">
              <button
                type="submit"
                id="submitBtn"
                class="btn btn-primary w-100"
              >
                Add Expense
              </button>
            </div>
          </form>

          <p id="message" class="mt-3 mb-0"></p>

          <hr />

          <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Your Expenses</h4>
            <span id="total" class="total-badge">Total: ₹0.00</span>
          </div>

          <ul id="expenseList" class="list-group mt-3"></ul>
        </div>
      </div>
    </div>

    <!-- Load order matters: each file depends on the ones above it -->
    <script src="state.js"></script>
    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script src="render.js"></script>
    <script src="actions.js"></script>
    <script src="main.js"></script>
  </body>
</html>
