<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-sm mx-auto" style="max-width: 850px">
        <div class="card-body p-4">
          <h2 class="mb-4">Expense Tracker</h2>

          <form id="expenseForm" class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Amount</label>
              <input
                type="number"
                id="amount"
                class="form-control"
                min="0.01"
                step="0.01"
                required
              />
            </div>

            <div class="col-md-4">
              <label class="form-label">Description</label>
              <input
                type="text"
                id="description"
                class="form-control"
                placeholder="Enter description"
                required
              />
            </div>

            <div class="col-md-3">
              <label class="form-label">Category</label>
              <select id="category" class="form-select">
                <option>Movie</option>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Other</option>
              </select>
            </div>

            <div class="col-md-2 d-flex align-items-end">
              <button
                type="submit"
                id="submitBtn"
                class="btn btn-primary w-100"
              >
                Add Expense
              </button>
            </div>
          </form>

          <p id="message" class="mt-3 mb-0 text-success"></p>
          <!-- //expense added successfully message -->

          <hr />

          <div class="d-flex justify-content-between">
            <h4>Your Expenses</h4>
            <strong id="total">Total: ₹0</strong>
          </div>

          <ul id="expenseList" class="list-group mt-3"></ul>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("expenseForm");
      const amountInput = document.getElementById("amount");
      const descriptionInput = document.getElementById("description");
      const categoryInput = document.getElementById("category");
      const submitBtn = document.getElementById("submitBtn");
      const expenseList = document.getElementById("expenseList");
      const totalElement = document.getElementById("total");
      const message = document.getElementById("message");

      let expenses = [];

      // Load saved expenses safely
      try {
        const saved = JSON.parse(localStorage.getItem("expenses") || "[]"); //JSON.parse() converts a JSON string into a JavaScript value.
        if (Array.isArray(saved)) expenses = saved;
      } catch (error) {
        expenses = [];
      }

      let editingId = null; // av  edit kiye ho kuc? no

      function saveExpenses() {
        localStorage.setItem("expenses", JSON.stringify(expenses));
      }

      function renderExpenses() {
        expenseList.replaceChildren(); //Without replaceChildren(), your function might append the existing expenses again, causing duplicates:
        let total = 0;

        expenses.forEach(function (expense) {
          total += expense.amount;

          const li = document.createElement("li");
          li.className =
            "list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2";

          const details = document.createElement("div");
          details.textContent = `${expense.amount} - ${expense.category} - ${expense.description}`;

          const buttons = document.createElement("div");
          buttons.className = "d-flex gap-2";

          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "btn btn-sm btn-outline-primary";
          editBtn.textContent = "Edit";
          editBtn.addEventListener("click", function () {
            startEdit(expense.id);
          });

          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "btn btn-sm btn-outline-danger";
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", function () {
            deleteExpense(expense.id);
          });

          buttons.append(editBtn, deleteBtn);
          li.append(details, buttons);
          expenseList.appendChild(li);
        });

        totalElement.textContent = `Total: ₹${total.toFixed(2)}`;

        if (expenses.length === 0) {
          const empty = document.createElement("li");
          empty.className = "list-group-item text-secondary";
          empty.textContent = "No expenses added yet.";
          expenseList.appendChild(empty);
        }
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const amount = Number(amountInput.value);
        const description = descriptionInput.value.trim();
        const category = categoryInput.value;

        if (!Number.isFinite(amount) || amount <= 0 || !description) {
          message.textContent = "Enter a valid amount and description.";
          message.className = "mt-3 text-danger";
          return;
        }

        if (editingId !== null) {
          expenses = expenses.map(function (expense) {
            if (expense.id === editingId) {
              return { ...expense, amount, description, category };
            }
            return expense;
          });

          message.textContent = "Expense updated successfully!";
        } else {
          expenses.push({
            id: Date.now() + Math.random(),
            amount,
            description,
            category,
          });

          message.textContent = "Expense added successfully!";
        }

        saveExpenses();
        renderExpenses();
        resetForm();
      });

      function startEdit(id) {
        const expense = expenses.find(function (item) {
          return item.id === id;
        });

        if (!expense) return;

        editingId = id;
        amountInput.value = expense.amount;
        descriptionInput.value = expense.description;
        categoryInput.value = expense.category;

        submitBtn.textContent = "Save Changes";
        submitBtn.className = "btn btn-success w-100";
        message.textContent = "Edit the fields and click Save Changes.";
        amountInput.focus();
      }

      function deleteExpense(id) {
        expenses = expenses.filter(function (expense) {
          return expense.id !== id;
        });

        if (editingId === id) resetForm();

        saveExpenses();
        renderExpenses();
        message.textContent = "Expense deleted successfully!";
      }

      function resetForm() {
        editingId = null;
        form.reset();
        submitBtn.textContent = "Add Expense";
        submitBtn.className = "btn btn-primary w-100";
      }

      renderExpenses();
    </script>
  </body>
</html>
